<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Sowld{% endblock %}</title>
<style>
  :root {
    --ink: #0B0B0C;
    --paper: #FAFAF7;
    --lime: #C6F135;
    --muted: #6B6B70;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.25rem 2rem;
    border-bottom: 1px solid #eee;
    flex-wrap: wrap;
    gap: 0.75rem;
  }
  header a { color: var(--ink); text-decoration: none; font-weight: 600; }
  .logo { font-size: 1.25rem; letter-spacing: -0.02em; }
  .lang-switch { display: flex; gap: 0.5rem; align-items: center; }
  .lang-switch a {
    font-weight: 500;
    font-size: 0.78rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .lang-switch a.active { color: var(--ink); font-weight: 700; }
  main { max-width: 720px; margin: 0 auto; padding: 3rem 1.5rem; }
  h1 { font-size: 2rem; letter-spacing: -0.02em; margin-bottom: 0.5rem; }
  p.lead { color: var(--muted); margin-bottom: 2rem; }
  form { display: flex; flex-direction: column; gap: 0.75rem; max-width: 420px; }
  input, select {
    padding: 0.75rem 1rem;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 1rem;
  }
  button {
    background: var(--ink);
    color: var(--paper);
    border: none;
    padding: 0.85rem 1.5rem;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button.lime { background: var(--lime); color: var(--ink); }
  .error { color: #b3261e; margin-bottom: 1rem; }
  table { width: 100%; border-collapse: collapse; margin-top: 2rem; font-size: 0.9rem; }
  th, td { text-align: left; padding: 0.6rem 0.5rem; border-bottom: 1px solid #eee; }
  .score { color: var(--ink); background: var(--lime); padding: 0.15rem 0.5rem; border-radius: 999px; font-weight: 600; font-size: 0.8rem; }
  a.plain { color: var(--muted); font-size: 0.9rem; }
</style>
</head>
<body>
<header>
  <a class="logo" href="/">Sowld</a>
  <div class="lang-switch">
    {% for code, name in languages.items() %}
      <a href="{{ request.url.path }}?lang={{ code }}" class="{{ 'active' if code == lang else '' }}" title="{{ name }}">{{ code.upper() }}</a>
    {% endfor %}
  </div>
  <nav>
    {% if user %}
      <span style="color: var(--muted); margin-right: 1rem;">{{ user.email }}</span>
      <form action="/logout" method="post" style="display:inline">
        <button type="submit" style="padding: 0.4rem 0.9rem; font-size: 0.85rem;">{{ t('nav.logout') }}</button>
      </form>
    {% else %}
      <a href="/login" style="margin-right: 1rem;">{{ t('nav.login') }}</a>
      <a href="/signup">{{ t('nav.signup') }}</a>
    {% endif %}
  </nav>
</header>
<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
