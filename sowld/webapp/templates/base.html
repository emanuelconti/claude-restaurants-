<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Sowld{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0B0B0C;
    --paper: #FAFAF7;
    --card: #FFFFFF;
    --lime: #C6F135;
    --lime-dark: #AEDA1E;
    --muted: #6B6B70;
    --border: #E7E7E2;
    --error-bg: #FBEAE9;
    --error-ink: #8C241C;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(11,11,12,0.04), 0 8px 24px rgba(11,11,12,0.05);
    --ease: cubic-bezier(.22,1,.36,1);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  h1, h2, h3 { font-family: "Inter Tight", Inter, sans-serif; letter-spacing: -0.03em; margin: 0; }
  .reveal { opacity: 0; transform: translateY(26px); transition: .8s var(--ease); }
  .reveal.visible { opacity: 1; transform: none; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.1rem 2rem;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    gap: 0.75rem;
    background: var(--paper);
    position: sticky;
    top: 0;
    z-index: 100;
    transition: background .3s var(--ease), border-color .3s var(--ease), color .3s var(--ease);
  }
  header a { color: var(--ink); text-decoration: none; }
  .logo {
    font-size: 1.15rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    font-family: "Inter Tight", Inter, sans-serif;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
  }
  .logo::before {
    content: "";
    width: 0.6rem;
    height: 0.6rem;
    border-radius: 3px;
    background: var(--lime);
    display: inline-block;
  }
  .lang-switch { display: flex; gap: 0.6rem; align-items: center; }
  .lang-switch a {
    font-weight: 600;
    font-size: 0.75rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 0.2rem 0.1rem;
    border-bottom: 2px solid transparent;
  }
  .lang-switch a.active { color: var(--ink); border-color: var(--lime); }
  nav { display: flex; align-items: center; gap: 1rem; font-size: 0.92rem; font-weight: 600; }
  nav a:hover { opacity: 0.7; }
  .user-email { color: var(--muted); font-weight: 500; font-size: 0.88rem; }

  /* Landing header always floats over the content (never reserves flow
     space) so the scroll-triggered transparent->solid swap can't shove
     the page down; it starts transparent over the dark hero and swaps
     to a solid bar once .scrolled is toggled by the scroll listener. */
  body.landing header {
    position: fixed;
    top: 0; left: 0; right: 0;
  }
  body.landing header:not(.scrolled) {
    background: transparent;
    border-bottom-color: transparent;
    color: #fff;
    box-shadow: none;
  }
  body.landing header.scrolled {
    box-shadow: 0 1px 0 var(--border);
  }
  body.landing header:not(.scrolled) .logo,
  body.landing header:not(.scrolled) nav a,
  body.landing header:not(.scrolled) .user-email { color: #fff; }
  body.landing header:not(.scrolled) .lang-switch a { color: rgba(255,255,255,.75); }
  body.landing header:not(.scrolled) .lang-switch a.active { color: #fff; }
  body.landing header:not(.scrolled) button.ghost { background: rgba(255,255,255,.14); color: #fff; border-color: rgba(255,255,255,.3); }

  main { max-width: 760px; margin: 0 auto; padding: 3.5rem 1.5rem 5rem; }
  body.landing main { max-width: none; padding: 0; }
  .wide { max-width: 1180px; margin: 0 auto; padding-inline: clamp(1.25rem, 3.5vw, 3rem); }
  h1 { font-size: 2.1rem; line-height: 1.15; margin: 0 0 0.6rem; }
  h2 { font-size: 1.1rem; letter-spacing: -0.01em; margin: 0 0 1rem; }
  p.lead { color: var(--muted); font-size: 1.05rem; line-height: 1.5; margin: 0 0 2rem; max-width: 46ch; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 1.75rem;
  }

  form { display: flex; flex-direction: column; gap: 0.85rem; max-width: 420px; }
  form.inline-form { flex-direction: row; flex-wrap: wrap; max-width: none; align-items: stretch; }
  form.inline-form input { flex: 1 1 180px; }
  form.inline-form select { flex: 0 0 auto; }
  label { font-size: 0.82rem; font-weight: 600; color: var(--muted); margin-bottom: -0.4rem; }

  input, select {
    padding: 0.8rem 1rem;
    border: 1px solid var(--border);
    border-radius: 9px;
    font-size: 0.98rem;
    background: var(--card);
    color: var(--ink);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
    font-family: inherit;
  }
  input:focus, select:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px rgba(11,11,12,0.06); }
  input::placeholder { color: #A8A8AC; }

  button {
    background: var(--ink);
    color: var(--paper);
    border: none;
    padding: 0.85rem 1.5rem;
    border-radius: 9px;
    font-size: 0.98rem;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.05s ease, background .2s ease, color .2s ease;
    font-family: inherit;
  }
  button:hover { opacity: 0.85; }
  button:active { transform: scale(0.98); }
  button.lime { background: var(--lime); color: var(--ink); }
  button.lime:hover { background: var(--lime-dark); opacity: 1; }
  button.white { background: #fff; color: var(--ink); }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); font-weight: 600; }
  button.ghost:hover { background: #F1F1EC; opacity: 1; }
  button.lg { padding: 1rem 1.9rem; font-size: 1.02rem; }
  button:hover.lg, button.lg:hover { transform: translateY(-2px); }

  .error { color: var(--error-ink); background: var(--error-bg); border-radius: 9px; padding: 0.85rem 1rem; margin-bottom: 1.5rem; font-size: 0.92rem; }

  .table-wrap { overflow-x: auto; margin-top: 1.5rem; border-radius: var(--radius); border: 1px solid var(--border); background: var(--card); }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; min-width: 480px; }
  th { text-align: left; padding: 0.85rem 1rem; color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 700; border-bottom: 1px solid var(--border); }
  td { text-align: left; padding: 0.85rem 1rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #FBFBF8; }

  .score { color: var(--ink); background: var(--lime); padding: 0.2rem 0.55rem; border-radius: 999px; font-weight: 700; font-size: 0.78rem; white-space: nowrap; }
  a.plain { color: var(--muted); font-size: 0.9rem; text-decoration: none; }
  a.plain:hover { color: var(--ink); text-decoration: underline; }
  .hint { color: var(--muted); font-size: 0.82rem; margin-top: -0.25rem; }
  .section-gap { margin-top: 2.75rem; }

  /* ---- Landing page building blocks ---- */
  .eyebrow { font-size: 0.75rem; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 800; opacity: 0.85; }

  .hero { min-height: 100svh; position: relative; display: flex; align-items: flex-end; overflow: hidden; background: #0e0d10; }
  .hero-bg { position: absolute; inset: -3%; background-size: cover; background-position: center 42%; animation: drift 20s var(--ease) infinite alternate; }
  .hero-scrim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8,7,10,.15), rgba(8,7,10,.2) 45%, rgba(8,7,10,.92)); }
  .hero-glow { position: absolute; inset: 0; background: radial-gradient(circle at 85% 15%, rgba(198,241,53,.16), transparent 30%); }
  @keyframes drift { to { transform: scale(1.06) translate3d(-.6%, .3%, 0); } }
  .hero-content { position: relative; z-index: 2; color: #fff; padding: 150px clamp(1.25rem, 3.5vw, 3rem) clamp(3rem, 7vw, 5.5rem); width: 100%; }
  .hero h1 { font-size: clamp(2.6rem, 7vw, 5.6rem); line-height: 0.98; max-width: 20ch; margin-top: 1rem; }
  .hero-sub { font-size: clamp(1.1rem, 1.6vw, 1.4rem); line-height: 1.5; color: rgba(255,255,255,.86); max-width: 46ch; margin-top: 1.4rem; }
  .hero-cta { display: flex; gap: 0.7rem; flex-wrap: wrap; margin-top: 1.8rem; }
  .hero-facts { display: flex; gap: 2.2rem; flex-wrap: wrap; margin-top: 3rem; color: rgba(255,255,255,.68); font-size: 0.82rem; }
  .hero-facts strong { display: block; color: #fff; font-size: 1.05rem; margin-bottom: 0.15rem; font-family: "Inter Tight", sans-serif; }

  .manifesto { padding: clamp(4.5rem, 8vw, 7rem) 0; background: var(--card); border-bottom: 1px solid var(--border); }
  .manifesto-grid { display: grid; grid-template-columns: .7fr 1.3fr; gap: 3rem; align-items: start; }
  .manifesto-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.14em; font-weight: 800; color: var(--ink); opacity: 0.5; position: sticky; top: 7rem; }
  .manifesto h2 { font-size: clamp(2.2rem, 5vw, 3.6rem); line-height: 1.02; }
  .manifesto h2 span { color: var(--ink); background: linear-gradient(180deg, transparent 62%, var(--lime) 62%); }
  .manifesto p { font-size: 1.2rem; line-height: 1.6; color: var(--muted); max-width: 42ch; margin-top: 1.6rem; }

  .story { padding: clamp(3.5rem, 6vw, 5.5rem) 0; }
  .story-row { display: grid; grid-template-columns: 1fr 1fr; min-height: 480px; margin-bottom: 1.4rem; border-radius: 22px; overflow: hidden; background: var(--card); border: 1px solid var(--border); }
  .story-row.reverse .story-copy { order: 2; } .story-row.reverse .story-image { order: 1; }
  .story-copy { padding: clamp(2rem, 5vw, 4.5rem); display: flex; flex-direction: column; justify-content: center; }
  .story-copy small { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.14em; font-weight: 800; color: var(--ink); opacity: 0.55; }
  .story-copy h2 { font-size: clamp(1.7rem, 3.6vw, 2.6rem); line-height: 1.05; margin: 0.7rem 0 1rem; }
  .story-copy p { font-size: 1.08rem; line-height: 1.55; color: var(--muted); max-width: 40ch; }
  .story-image { min-height: 340px; background-size: cover; background-position: center; transition: 1.1s var(--ease); }
  .story-row:hover .story-image { transform: scale(1.03); }

  .system { background: var(--ink); color: #fff; padding: clamp(3.5rem, 7vw, 6rem) 0; }
  .system-title { font-size: clamp(1.9rem, 4.6vw, 3.2rem); line-height: 1.05; max-width: 22ch; margin-bottom: 2.4rem; }
  .system-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.14); border-radius: 18px; overflow: hidden; }
  .system-item { background: #18161a; padding: 1.5rem; min-height: 160px; display: flex; flex-direction: column; justify-content: space-between; }
  .system-item span { font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,.5); font-weight: 800; }
  .system-item strong { font: 800 1.15rem/1.15 "Inter Tight", sans-serif; letter-spacing: -0.01em; margin-top: 1rem; }

  .proof { padding: clamp(3.5rem, 6vw, 5.5rem) 0; }
  .proof-head { display: grid; grid-template-columns: .4fr 1fr; gap: 2.5rem; align-items: start; margin-bottom: 2.6rem; }
  .proof-head span { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.14em; font-weight: 800; opacity: 0.5; }
  .proof-head h2 { font-size: clamp(1.8rem, 4.2vw, 2.9rem); line-height: 1.05; }
  .proof-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.9rem; }
  .proof-grid article { padding: 1.6rem; min-height: 230px; border: 1px solid var(--border); border-radius: 16px; display: flex; flex-direction: column; background: var(--card); }
  .proof-grid small { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); font-weight: 800; }
  .proof-grid strong { font: 800 clamp(1.35rem, 2.6vw, 1.7rem)/1.15 "Inter Tight", sans-serif; margin-top: auto; padding-top: 1rem; }
  .proof-grid p { color: var(--muted); line-height: 1.5; margin-top: 0.9rem; font-size: 0.94rem; }
  .proof-highlight { background: var(--ink) !important; color: #fff; border-color: var(--ink) !important; }
  .proof-highlight small, .proof-highlight p { color: rgba(255,255,255,.65); }
  .proof-highlight strong { color: var(--lime); }

  .launch { padding: 1rem 0 clamp(3.5rem, 6vw, 5.5rem); }
  .launch-card { background: var(--ink); color: #fff; border-radius: 22px; padding: clamp(2.2rem, 6vw, 4.5rem); position: relative; overflow: hidden; }
  .launch-card::before { content: ""; position: absolute; width: 420px; height: 420px; border-radius: 50%; right: -140px; top: -170px; background: radial-gradient(circle, var(--lime), transparent 68%); opacity: 0.5; }
  .launch-card h2 { font-size: clamp(1.8rem, 4.6vw, 3rem); line-height: 1.05; position: relative; z-index: 2; max-width: 18ch; }
  .launch-card p { color: rgba(255,255,255,.72); font-size: 1.05rem; line-height: 1.55; max-width: 42ch; margin-top: 1rem; position: relative; z-index: 2; }
  .launch-card .hero-cta { position: relative; z-index: 2; margin-top: 1.6rem; }

  .footer { padding: 2rem 0 2.6rem; color: var(--muted); font-size: 0.85rem; }

  @media (max-width: 900px) {
    .manifesto-grid, .story-row, .story-row.reverse, .proof-head { grid-template-columns: 1fr; }
    .story-row.reverse .story-copy, .story-row.reverse .story-image { order: initial; }
    .story-image { min-height: 260px; order: -1; }
    .manifesto-label { position: static; }
    .system-grid { grid-template-columns: 1fr 1fr; }
    .proof-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 700px) {
    nav .lang-switch, nav .user-email { display: none; }
    .hero-content { padding-top: 120px; }
    .system-grid { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
  }
</style>
<noscript><style>.reveal { opacity: 1 !important; transform: none !important; }</style></noscript>
</head>
<body class="{% block body_class %}{% endblock %}">
<header id="topbar">
  <a class="logo" href="/">Sowld</a>
  <div class="lang-switch">
    {% for code, name in languages.items() %}
      <a href="{{ lang_switch_path }}?lang={{ code }}" class="{{ 'active' if code == lang else '' }}" title="{{ name }}">{{ code.upper() }}</a>
    {% endfor %}
  </div>
  <nav>
    {% if user %}
      <span class="user-email">{{ user.email }}</span>
      <form action="/logout" method="post" style="margin:0;">
        <button type="submit" class="ghost" style="padding: 0.5rem 1rem; font-size: 0.85rem;">{{ t('nav.logout') }}</button>
      </form>
    {% else %}
      <a href="/login">{{ t('nav.login') }}</a>
      <a href="/signup">{{ t('nav.signup') }}</a>
    {% endif %}
  </nav>
</header>
<main>
  {% block content %}{% endblock %}
</main>
<script>
(function () {
  var revealEls = document.querySelectorAll('.reveal');
  try {
    if (!('IntersectionObserver' in window)) throw new Error('no IntersectionObserver');
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { if (e.isIntersecting) e.target.classList.add('visible'); });
    }, { threshold: 0.12 });
    revealEls.forEach(function (el) { io.observe(el); });
  } catch (e) {
    // No JS support for scroll reveal (or something threw) — never let
    // content stay invisible because of it.
    revealEls.forEach(function (el) { el.classList.add('visible'); });
  }
  // Belt and suspenders: anything still unrevealed after 4s (an observer
  // that never fires, an element outside any viewport it can reach) is
  // shown anyway rather than staying permanently blank.
  setTimeout(function () {
    revealEls.forEach(function (el) { el.classList.add('visible'); });
  }, 4000);

  if (document.body.classList.contains('landing')) {
    var topbar = document.getElementById('topbar');
    var sync = function () {
      topbar.classList.toggle('scrolled', window.scrollY > window.innerHeight * 0.72);
    };
    window.addEventListener('scroll', sync, { passive: true });
    sync();
  }
})();
</script>
</body>
</html>
