{% extends "base.html" %}
{% block title %}Sowld{% endblock %}
{% block content %}
<h1>{{ t('login.title') }}</h1>
<div class="card" style="max-width:420px;">
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="email" name="email" placeholder="{{ t('login.email') }}" required>
    <input type="password" name="password" placeholder="{{ t('login.password') }}" required>
    <button type="submit">{{ t('login.submit') }}</button>
  </form>
</div>
<p style="margin-top:1.25rem;"><a class="plain" href="/signup">{{ t('login.no_account') }}</a></p>
{% endblock %}
