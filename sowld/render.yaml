services:
  - type: web
    name: sowld
    runtime: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SESSION_SECRET_KEY
        generateValue: true
      - key: MONTHLY_SEARCH_LIMIT
        value: "50"
      # Defaults to a local SQLite file, which is wiped on every redeploy —
      # once you've created a Postgres instance on Render, override this
      # with its connection string (see DEPLOY.md). Leaving it as-is is
      # fine while you're still testing.
      - key: DATABASE_URL
        value: sqlite:///./sowld.db
