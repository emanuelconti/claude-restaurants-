<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;background:#1b1740;overflow:hidden;font-family:-apple-system,"Inter","Helvetica Neue",Arial,sans-serif}
canvas{display:block}
#title{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(40,25,90,.55),rgba(40,25,90,0) 60%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;opacity:0;text-align:center;text-shadow:0 4px 30px rgba(40,20,90,.55)}
#title h1{font-size:96px;margin:0;font-weight:800;letter-spacing:-2px}
#title p{font-size:34px;margin:14px 0 0;font-weight:500;opacity:.92}
#cap{position:absolute;left:0;right:0;bottom:70px;text-align:center;color:#fff;font-size:34px;font-weight:600;opacity:0;text-shadow:0 2px 18px rgba(30,10,70,.6)}
</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
</head><body>
<div id="cap"></div>
<div id="title"><h1>SocialPerks</h1><p>Your customers bring you new customers.</p></div>
<script type="module">
import * as THREE from 'three';
const Q=new URLSearchParams(location.search);const W=+(Q.get('w')||1080),H=+(Q.get('h')||1920);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setSize(W,H);renderer.setPixelRatio(1);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
// pastel dusk sky (Boat-like)
const sky=new THREE.Mesh(new THREE.SphereGeometry(400,32,16),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,
 uniforms:{},vertexShader:`varying vec3 p;void main(){p=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
 fragmentShader:`varying vec3 p;void main(){float h=p.y;vec3 top=vec3(.33,.36,.78),mid=vec3(.86,.62,.78),low=vec3(1.,.74,.52);
 vec3 c=mix(low,mid,smoothstep(-.02,.18,h));c=mix(c,top,smoothstep(.15,.6,h));gl_FragColor=vec4(c,1.);}`}));
scene.add(sky);
scene.fog=new THREE.Fog(0xe7a6b6,40,150);
scene.add(new THREE.HemisphereLight(0xffd7c2,0x4a3f8f,0.9));
const sun=new THREE.DirectionalLight(0xffb88a,1.6);sun.position.set(-40,25,-30);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-50,right:50,top:50,bottom:-50,far:150});scene.add(sun);
const mat=(c,e=0)=>new THREE.MeshStandardMaterial({color:c,roughness:.85,flatShading:true,emissive:e?c:0x000000,emissiveIntensity:e});
// water + ground
const water=new THREE.Mesh(new THREE.PlaneGeometry(400,400,80,80),new THREE.MeshStandardMaterial({color:0x8e7fd6,roughness:.25,metalness:.2,flatShading:true}));
water.rotation.x=-Math.PI/2;water.position.y=-0.6;scene.add(water);
const wpos=water.geometry.attributes.position;const wbase=wpos.array.slice();
const ground=new THREE.Mesh(new THREE.BoxGeometry(60,1,34),mat(0xe9d7c6));ground.position.y=-.5;ground.receiveShadow=true;scene.add(ground);
function box(w,h,d,c,x,y,z,parent=scene){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;parent.add(m);return m}
// padel court
box(10,.08,6,0x3d6fd8,-14,.04,4);box(10.2,.06,.08,0xffffff,-14,.1,4);
box(.08,1,6,0xffffff,-14,.5,4).material=new THREE.MeshStandardMaterial({color:0xffffff,transparent:true,opacity:.55});
for(const x of[-19,-9])box(.1,2.2,6,0xbfd6ff,x,1.1,4).material=new THREE.MeshStandardMaterial({color:0xcfe0ff,transparent:true,opacity:.35});
// café with awning and warm windows
box(8,5,6,0xf3e3cf,6,2.5,-8);box(8.6,.5,6.6,0xc9786a,6,5.2,-8);
const aw=box(8,.2,2.2,0xe0626a,6,3.2,-4.4);aw.rotation.x=-.35;
for(const x of[3.5,6,8.5]){const w=box(1.6,1.6,.1,0xffc36b,x,2.2,-4.95);w.material=mat(0xffc36b,1.4)}
// tattoo studio
box(6,6.5,6,0xb9a6e8,18,3.25,-6);for(const y of[2,4.5]){const w=box(3,1.2,.1,0xff9fd1,18,y,-2.95);w.material=mat(0xff9fd1,1.2)}
// car park with cars
box(14,.06,8,0x6f6a8f,14,.03,8);
for(let i=0;i<6;i++)box(.12,.07,3,0xffffff,8.2+i*2.3,.07,6);
const carCols=[0xf26d6d,0x5a8cf0,0xf4c062];[[9.3,6],[11.6,6],[16.2,6]].forEach(([x,z],i)=>{box(1.6,.7,2.8,carCols[i],x,.45,z);box(1.3,.6,1.5,0xe9eefc,x,1.05,z-.1)});
// background buildings
for(let i=0;i<14;i++){const h=4+((i*7)%9);box(4,h,4,[0xd8b4d8,0xc6b3ef,0xf0c9b8][i%3],-28+i*4.4,h/2,-15-(i%2)*3)}
// lamps
const lamps=[];for(const [x,z] of [[-6,-1],[0,4],[10,1],[-20,-2],[22,2]]){box(.15,3.4,.15,0x3b3561,x,1.7,z);
 const b=new THREE.Mesh(new THREE.SphereGeometry(.28,12,8),mat(0xffd08a,2.2));b.position.set(x,3.5,z);scene.add(b);
 const l=new THREE.PointLight(0xffb870,6,9,1.6);l.position.set(x,3.3,z);scene.add(l);lamps.push(l)}
// people: one customer + new customers that follow glowing trails to venues
function person(c){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.28,.6,4,8),mat(c));body.position.y=.65;body.castShadow=true;
 const head=new THREE.Mesh(new THREE.SphereGeometry(.24,12,8),mat(0xf2d0b5));head.position.y=1.38;head.castShadow=true;g.add(body,head);scene.add(g);return g}
const origin=new THREE.Vector3(0,0,10);
const hero=person(0x6c4cf0);hero.position.copy(origin);
const targets=[new THREE.Vector3(-14,0,4),new THREE.Vector3(6,0,-3),new THREE.Vector3(18,0,-2),new THREE.Vector3(12,0,8)];
const cols=[0xffc14d,0x46c29a,0xff7aa8,0x58a6ff];
const walkers=targets.map((t,i)=>({p:person(cols[i]),t,delay:2.4+i*.55}));
// glowing link pulses from the hero to each venue
const pulses=targets.map((t,i)=>{const s=new THREE.Mesh(new THREE.SphereGeometry(.22,12,8),mat(cols[i],3));scene.add(s);
 const curve=new THREE.QuadraticBezierCurve3(origin.clone().setY(1.8),origin.clone().lerp(t,.5).setY(7),t.clone().setY(2.2));
 const tube=new THREE.Mesh(new THREE.TubeGeometry(curve,40,.05,6),new THREE.MeshBasicMaterial({color:cols[i],transparent:true,opacity:0}));scene.add(tube);
 return {s,curve,tube,start:1.0+i*.35}});
// rings that pop on arrival ("verified visit")
const rings=targets.map((t,i)=>{const r=new THREE.Mesh(new THREE.TorusGeometry(1,.06,8,40),mat(cols[i],2));r.rotation.x=Math.PI/2;r.position.copy(t).setY(.1);r.scale.setScalar(.001);scene.add(r);return r});
const camera=new THREE.PerspectiveCamera(38,W/H,.1,600);
const ease=x=>x<0?0:x>1?1:x*x*(3-2*x);
const cap=document.getElementById('cap'),title=document.getElementById('title');
window.renderAt=(t)=>{
 // camera: slow arc from wide sunset to over-the-shoulder, then pull back for the title
 const a=-0.55+t*0.055, r=40-t*1.3+ease((t-7.2)/2.5)*14;
 camera.position.set(Math.sin(a)*r,14-t*.5+ease((t-7.2)/2.5)*8,Math.cos(a)*r);
 camera.lookAt(2,1.5-ease((t-7.2)/2.5)*.5,0);
 // gentle water
 for(let i=0;i<wpos.count;i++){const x=wbase[i*3],y=wbase[i*3+1];wpos.array[i*3+2]=Math.sin(x*.15+t*1.3)*.25+Math.cos(y*.12+t)*.2}
 wpos.needsUpdate=true;water.geometry.computeVertexNormals();
 hero.rotation.y=Math.sin(t*2)*.15;
 pulses.forEach(p=>{const k=ease((t-p.start)/1.2);p.s.position.copy(p.curve.getPoint(Math.min(k,1)));p.s.visible=k>0&&k<1;p.tube.material.opacity=k>0?.55*(1-ease((t-8)/1.2)):0});
 walkers.forEach((w,i)=>{const k=ease((t-w.delay)/2.6);const from=origin.clone().add(new THREE.Vector3((i-1.5)*1.2,0,6));
  w.p.position.lerpVectors(from,w.t,k);w.p.position.y=Math.abs(Math.sin(t*9+i))*.12*(k>0&&k<1);w.p.lookAt(w.t.x,0,w.t.z);w.p.visible=t>w.delay-.3;
  const rk=ease((t-(w.delay+2.6))/.6);rings[i].scale.setScalar(rk>0?.2+rk*1.6:.001);rings[i].material.opacity=1});
 lamps.forEach((l,i)=>l.intensity=5+Math.sin(t*3+i)*.6);
 const caps=[[0.6,3.2,'One customer shares a link.'],[3.4,6.4,'New customers arrive in your quiet hours.'],[6.6,8.0,'You pay only for verified new visits.']];
 let txt='',op=0;for(const[s,e,c]of caps){if(t>=s&&t<e){txt=c;op=Math.min(ease((t-s)/.4),1-ease((t-(e-.4))/.4))}}
 cap.textContent=txt;cap.style.opacity=op;title.style.opacity=ease((t-8.1)/.8);
 renderer.render(scene,camera);
};
window.renderAt(0);window.ready=true;
</script></body></html>
