name: SocialPerks Daily Outreach — Tutte le Città

on:
  workflow_dispatch:        # SOLO manuale — schedule DISABILITATO

concurrency:
  group: outreach
  cancel-in-progress: false  # non cancellare, aspetta — mai due run in parallelo

jobs:
  outreach:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa dipendenze
        run: pip install -r requirements_outreach.txt

      - name: Esegui outreach ristoranti (tutte le città)
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 outreach_multi.py run --all

      - name: Esegui outreach tattoo studios (tutte le città)
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 outreach_tattoo.py run --all

      - name: Salva stato tracking (tutti i DB)
        run: |
          git config user.name "SocialPerks Bot"
          git config user.email "socialperks-bot@github.com"
          git add -f outreach_*.db outreach_tracking.db
          git diff --cached --quiet || git commit -m "Update outreach tracking [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push && break || sleep $((i * 4))
          done
