name: Social publisher by market
on:
  schedule:
    - cron: '47 9-23 * * *'
      timezone: Europe/Madrid
    - cron: '23 8-23 * * *'
      timezone: Europe/Paris
    - cron: '17 8-23 * * *'
      timezone: Asia/Singapore
    - cron: '41 0-23 * * *' # UTC recovery checks; policy retains each brand's local slots and daily cap
  workflow_dispatch:
    inputs:
      mode:
        description: Check credentials only or process approved queue
        type: choice
        options: [validate, check, publish, recover-gms, owner-av-test-20261103]
        default: validate
      brand:
        description: Brand to check or publish (scheduled runs use their own market)
        type: choice
        options: [all, gms, sp, sin]
        default: all
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: social-cloud-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/social-cloud-backup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install rendering dependencies
        run: |
          python -m pip install pillow numpy certifi
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Test queue policy
        run: python -m unittest discover -s social-cloud-backup -p 'test_*.py'
      - name: Verify or publish reviewed queue
        env:
          SOCIAL_BACKUP_ENV: ${{ secrets.SOCIAL_BACKUP_ENV }}
          BACKUP_MODE: ${{ inputs.mode }}
          BACKUP_BRAND: ${{ inputs.brand }}
          BACKUP_CRON: ${{ github.event.schedule }}
        run: |
          if [ "$BACKUP_MODE" = validate ]; then
            python social-cloud-backup/controller.py --validate
          elif [ "$BACKUP_MODE" = check ]; then
            python social-cloud-backup/controller.py --check
          elif [ "$BACKUP_MODE" = recover-gms ]; then
            python social-cloud-backup/controller.py --recover-gms
          elif [ "$BACKUP_MODE" = owner-av-test-20261103 ]; then
            python social-cloud-backup/controller.py --owner-av-test-20261103
          else
            python social-cloud-backup/controller.py
          fi
      - name: Daily market results and queue health
        if: always()
        env:
          SOCIAL_BACKUP_ENV: ${{ secrets.SOCIAL_BACKUP_ENV }}
          GH_TOKEN: ${{ github.token }}
        run: python social-cloud-backup/health_report.py
      - name: Persist publication receipts
        if: always()
        run: |
          if [ -f social-cloud-backup/state.json ]; then
            git config user.name social-backup-bot
            git config user.email social-backup-bot@users.noreply.github.com
            git add social-cloud-backup/state.json
            git add social-cloud-backup/performance/ social-cloud-backup/health.json 2>/dev/null || true
            git diff --cached --quiet || git commit -m "Record cloud publishing receipts"
            git push origin HEAD:codex/social-cloud-backup
          fi
      - name: Arm the next server-side recovery
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          state=$(gh api "repos/$GH_REPO/actions/workflows/social-cloud-watchdog.yml" --jq .state)
          if [ "$state" != active ]; then
            echo "Recovery timer disabled; owner control is respected."
            exit 0
          fi
          gh workflow run social-cloud-watchdog.yml --repo "$GH_REPO" --ref claude/coao-8jloui -f smoke_test=false
          echo "Next recovery armed with the normal server-side wait."
