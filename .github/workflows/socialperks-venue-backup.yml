name: SocialPerks guarded venue backup
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check is read-only; import loads reviewed private drafts; send uses market guards'
        type: choice
        options: [check, import, send]
        default: check
  schedule:
    - cron: '23 10-17 * * 1-5'
permissions:
  contents: read
concurrency:
  group: outreach
  cancel-in-progress: false
jobs:
  venue-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test delivery boundaries before mailbox access
        run: python3 -m unittest discover -s tests -p 'test_outreach_cloud.py'
      - name: Guarded private Gmail queue
        env:
          SOCIALPERKS_GMAIL_APP_PASSWORD: ${{ secrets.SOCIALPERKS_GMAIL_APP_PASSWORD }}
          OUTREACH_MODE: ${{ github.event_name == 'schedule' && 'send' || inputs.mode }}
        run: |
          set -o pipefail
          python3 scripts/outreach_cloud.py --mode "$OUTREACH_MODE" | tee "$RUNNER_TEMP/outreach-status.log"
      - name: Publish actual delivery status
        if: always()
        shell: bash
        run: |
          status_file="$RUNNER_TEMP/outreach-status.log"
          if [ -f "$status_file" ]; then
            grep '^OUTREACH' "$status_file" >> "$GITHUB_STEP_SUMMARY" || true
            if grep -q '^OUTREACH=outside_market_hours$' "$status_file"; then
              echo "::warning::No emails sent: runner started outside the permitted market window."
            fi
          fi
